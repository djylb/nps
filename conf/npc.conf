# npc 客户端配置：连接 nps 服务端 / npc client configuration: connects to an nps server
# 在 nps 网页管理界面创建客户端，把得到的 vkey 填在这里
# Create a client in the nps web admin and put its vkey here
[common]
# 服务端地址（混合端口） / Server address (mixed port)
server_addr=127.0.0.1:8024
# 承载方式：tcp、tls、ws、wss、quic / Transport: tcp, tls, ws, wss, quic
conn_type=tls
# 客户端验证密钥 / Client verification key
vkey=123
# 断线后自动重连 / Reconnect automatically after disconnect
auto_reconnection=true
# 绑定本机出口地址 / Bind to a local outbound address
#local_ip=192.168.1.100
# 最大并发连接数 / Max concurrent connections
#max_conn=1000
# 断线检测超时（秒） / Disconnect detection timeout (seconds)
#disconnect_timeout=30

# 点对点本地访问示例：把本机 2001 端口映射到另一个 npc 提供的目标
# P2P local access example: map local port 2001 to a target served by another npc
# password 与对方隧道的密码一致，conn_mode 可选 auto、direct、relay
# password must match the peer tunnel's; conn_mode: auto, direct or relay
#[secret_ssh]
#local_type=tcp
#conn_mode=auto
#local_port=2001
#password=ssh2
#target_addr=127.0.0.1:22
