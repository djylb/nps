# nps 配置。未写出的设置使用默认值，完整列表见 docs/reference/server-config.md
# nps configuration. Unlisted settings use defaults; full list in docs/reference/server-config.md
# 相对路径以 nps 的运行目录为准（instance_key_file 以本文件所在目录为准） / Relative paths resolve against nps's run directory (instance_key_file against this file's directory)

#### 运行 / Runtime ####
# 安全模式：客户端认证带时间戳，防重放 / Secure mode: timestamped client auth to prevent replay
secure_mode=true
dns_server=8.8.8.8
# 客户端断开后等待多少秒才判定离线 / Seconds to wait before marking a disconnected client offline
disconnect_timeout=30
#timezone=Asia/Shanghai

#### 混合端口 / Mixed port ####
# TCP 接 tls、wss 和域名转发，UDP 同端口号接 quic；0 关闭
# TCP serves tls, wss and domain forwarding; UDP on the same port serves quic; 0 disables
mix_port=8024
#mix_ip=
# 前面有自己的 TLS 反代时打开，接受明文承载 / Enable behind your own TLS proxy to accept plaintext transport
#mix_plain=false
# 客户端连接的访问地址，用于网页上生成的命令；可带端口，作为混合端口对外的端口 / Address clients connect to, used in commands generated on the web UI; a port given is the mixed port as seen from outside
bridge_addr=
# 相同 vkey 的多个客户端：Primary 主备 | RoundRobin 轮询 | Random 随机
# Multiple clients sharing a vkey: Primary (failover) | RoundRobin | Random
bridge_select_mode=Primary
# 公共密钥：配置文件模式的客户端公钥，空为禁用 / Public key for config-file clients; empty disables
public_vkey=
# 访客密钥：给点对点隧道的访问者用，代替客户端自己的 vkey；只能访问点对点，不能注册隧道
# Visitor key: give it to visitors of P2P tunnels instead of a client's own vkey; reaches P2P access only, cannot register tunnels
visitor_vkey=
# P2P 的 NAT 观测端使用 UDP p2p_port 起的 3 个端口；0 关闭
# P2P NAT observers use 3 UDP ports starting at p2p_port; 0 disables
p2p_port=6000
# 告知客户端的服务端地址（IP 或域名，逗号分隔），空为自动识别
# Server address advertised to clients (IPs or domains, comma-separated); empty auto-detects
p2p_ip=
#allow_ports=9001-9009,10001,11000-12000

#### 域名代理 / Domain proxy ####
# 端口为 0 时不启动 / Not started when the port is 0
http_proxy_ip=0.0.0.0
http_proxy_port=80
https_proxy_port=443
https_default_cert_file=conf/server.pem
https_default_key_file=conf/server.key
# 自动申请证书（需要 80/443 可从公网访问） / Auto-issue certificates (ports 80/443 must be reachable from the internet)
force_auto_ssl=false
ssl_email=you@yours.com
# LetsEncrypt | ZeroSSL | GoogleTrust
ssl_ca=LetsEncrypt
#ssl_zerossl_api=
ssl_path=conf/ssl
# 证书缓存重载间隔（秒） / Certificate cache reload interval (seconds)
ssl_cache_reload=3600
http_add_origin_header=true
x_nps_http_only=

#### 网页管理 / Web admin ####
# 管理员账号密码：在这里设置，改后重启或重载配置；也可只用 totp_secret 登录
# Admin username and password: set them here, then restart or reload; totp_secret alone also works
web_username=
web_password=
# 为 true 时，用户名为空，或密码和 totp_secret 都为空，则任何人都不能登录管理员，直到设置好
# When true, an empty username, or an empty password with no totp_secret, blocks admin login until set
web_require_password=true
web_host=a.o.com
web_ip=0.0.0.0
web_port=8081
web_open_ssl=false
web_cert_file=conf/server.pem
web_key_file=conf/server.key
#web_base_url=/nps
# 多用户：允许客户端用户登录和注册 / Multi-user: allow client users to log in and register
allow_user_login=false
allow_user_register=false
allow_user_change_username=false

#### 安全 / Security ####
open_captcha=true
# 双因素认证密钥，用 nps -gen2fa 生成 / Two-factor auth secret; generate with nps -gen2fa
totp_secret=
# Web API 认证密钥，空为禁用 / Web API auth key; empty disables
auth_key=
auth_crypt_key=
# 前面有反向代理时：信任的代理 IP，以及是否采信 X-Real-IP
# Behind a reverse proxy: trusted proxy IPs, and whether to honor X-Real-IP
allow_x_real_ip=false
trusted_proxy_ips=127.0.0.1
# 登录来源名单：0 关闭 | 1 白名单 | 2 黑名单 / Login source list: 0 off | 1 allowlist | 2 denylist
#login_acl_mode=0
#login_acl_rules=127.0.0.1,10.0.0.0/8
# 实例主密钥文件，请备份且不要公开 / Instance master key file; back it up and keep it private
#instance_key_file=instance.key

#### 限制 / Limits ####
allow_flow_limit=true
allow_rate_limit=true
allow_time_limit=true
allow_tunnel_num_limit=true
allow_connection_num_limit=true
allow_local_proxy=true
allow_user_local=false
allow_multi_ip=true
# 流量持久化间隔（分钟） / Traffic persistence interval (minutes)
flow_store_interval=1
system_info_display=true

#### 日志 / Logging ####
# stdout | file | both | off
log=stdout
# trace | debug | info | warn | error | off，可按模块：info,p2p=debug
# Log level, optionally per module: info,p2p=debug
log_level=info
log_path=conf/nps.log
log_compress=false
log_max_files=10
log_max_days=7
# 单个日志文件的最大 MB / Max size of a single log file (MB)
log_max_size=2
#security_log=conf/security.log
#access_log=logs/access.log
