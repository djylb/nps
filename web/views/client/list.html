<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5 langtag="page-clientlist"></h5>
                    {{if eq true .isAdmin}}
                    <div id="global_traffic" class="text-muted small" style="display: none; line-height: 1.15;" role="group" aria-labelledby="global_traffic_label">
                        <span id="global_traffic_label" class="sr-only" langtag="word-globaltraffic"></span>
                        <div class="d-flex flex-nowrap align-items-center" style="gap: 20px; font-variant-numeric: tabular-nums;">
                            <i class="fa fa-server" aria-hidden="true"></i>
                            <div class="text-nowrap" style="display: grid; grid-template-columns: max-content max-content; column-gap: 8px;">
                                <span langtag="word-forwardin"></span><strong class="text-right" id="global_traffic_in"></strong>
                                <span langtag="word-forwardout"></span><strong class="text-right" id="global_traffic_out"></strong>
                            </div>
                            <div class="text-nowrap" style="display: grid; grid-template-columns: max-content max-content; column-gap: 8px;">
                                <span langtag="word-totalflow"></span><strong class="text-right" id="global_traffic_total"></strong>
                                <span langtag="word-actualflow"></span><strong class="text-right" id="global_traffic_actual"></strong>
                            </div>
                            <div class="text-nowrap" style="display: grid; grid-template-columns: max-content max-content; column-gap: 8px;">
                                <span langtag="word-uploadspeed"></span><strong class="text-right" id="global_traffic_rate_in"></strong>
                                <span langtag="word-downloadspeed"></span><strong class="text-right" id="global_traffic_rate_out"></strong>
                            </div>
                            <div id="global_traffic_limit_box" class="text-nowrap align-self-start">
                                <span langtag="word-ratelimit"></span> <strong id="global_traffic_limit"></strong>
                            </div>
                        </div>
                    </div>
                    {{end}}
                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
                {{if eq true .isAdmin}}
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar">
                            <div class="list-toolbar-primary">
                                <a class="btn btn-primary dim" href="{{.web_base_url}}/client/add">
                                    <i class="fa fa-fw fa-lg fa-plus"></i>
                                    <span langtag="word-add"></span>
                                </a>
                                <a class="btn btn-danger dim" onclick="submitform('clear', '{{.web_base_url}}/client/clear', {'id': 0, 'mode': 'flow'})">
                                    <i class="fa fa-fw fa-lg fa-eraser"></i>
                                    <span langtag="word-clearflow"></span>
                                </a>
                                <a class="btn btn-warning dim" onclick="triggerVisibleClientPing(this)">
                                    <i class="fa fa-fw fa-lg fa-signal"></i>
                                    <span langtag="word-ping"></span>
                                </a>
                            </div>
                        </div>
                        <table class="table-striped table-hover" data-mobile-responsive="true" id="taskList_table"></table>
                    </div>
                </div>
                {{end}}
                <div class="ibox-content">
                    <table id="table"></table>
                </div>
            </div>
        </div>
    </div>
</div>
<div class="modal fade" id="qrModal" tabindex="-1" role="dialog" aria-labelledby="qrModalLabel" aria-hidden="true" data-backdrop="false" data-keyboard="true">
    <div class="modal-dialog modal-dialog-centered" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="qrModalLabel">TOTP</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body text-center">
                <img id="qrImg" src="" alt="QR" style="max-width: 100%; height: auto;" />
            </div>
        </div>
    </div>
</div>

<script>
    /*bootstrap table*/
    $('#table').bootstrapTable({
        toolbar: "#toolbar",
        idField: "Id",
        uniqueId: "Id",
        clickToSelect: false,
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/client/list", // 服务器数据的加载地址
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        search: true,
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true,//分页
        sidePagination: 'server',//服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50, 100, 'all'],
        cookie: true,
        cookieIdTable: 'client',
        cookieStorage: 'localStorage',
        detailView: true,
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function () {$('body').setLang ('.detail-view');},
        onPostBody: function (data) { if ($(this)[0].locale != undefined) $('body').setLang('#table'); },
        onLoadSuccess: function (res) { showGlobalTraffic(res && res.traffic); },
        detailFormatter: function (index, row, element) {
            var quotas = '<b langtag="word-maxconnections"></b>: '
                {{if eq true .isAdmin}}
                + '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'conn_limit\'})">' + row.MaxConn + '</span>'
                {{else}}
                + row.MaxConn
                {{end}}
                + '&emsp;'
                + '<b langtag="word-curconnections"></b>: ' + npsLiveValue('NowConn', row.NowConn) + '&emsp;'
                + '<b langtag="word-flowlimit"></b>: '
                {{if eq true .isAdmin}}
                + '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + row.Flow.FlowLimit + '</span>'
                {{else}}
                + row.Flow.FlowLimit
                {{end}}
                + 'MB&emsp;'
                + '<b langtag="word-timelimit"></b>: '
                {{if eq true .isAdmin}}
                + '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + row.Flow.TimeLimit + '</span>'
                {{else}}
                + row.Flow.TimeLimit
                {{end}}
                + '&emsp;'
                + '<b langtag="word-ratelimit"></b>: '
                {{if eq true .isAdmin}}
                + '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'rate_limit\'})">' + row.RateLimit + '</span>'
                {{else}}
                + row.RateLimit
                {{end}}
                + 'KB/s&emsp;'
                + '<b langtag="word-maxtunnels"></b>: '
                {{if eq true .isAdmin}}
                + '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'tunnel_limit\'})">' + row.MaxTunnelNum + '</span>'
                {{else}}
                + row.MaxTunnelNum
                {{end}}
                + '&emsp;<br/><br/>'
            var status = '<b langtag="word-createtime"></b>: ' + row.CreateTime + '&emsp;'
                + '<b langtag="word-lastonlinetime"></b>: ' + npsLiveValue('LastOnlineTime', row.LastOnlineTime) + '&emsp;'
                + '<b langtag="word-address"></b>: <span onclick="oCopy(this)">' + row.Addr + '</span>&emsp;'
                + '<b langtag="word-localaddress"></b>: <span onclick="oCopy(this)">' + row.LocalAddr + '</span>&emsp;<br/><br/>'
            status += '<div data-live-field="ConnectionHistory">' + npsHistoryHTML(row.ConnectionHistory) + '</div><br/>'
            var account = ''
            if (row.WebUserName || row.WebPassword) {
                account += '<b langtag="word-webusername"></b>: ' + row.WebUserName + '&emsp;'
                + '<b langtag="word-webpassword"></b>: ' + row.WebPassword + '&emsp;'
            }
            if (row.WebUserName && row.WebTotpSecret) {
                account += '<b langtag="word-webtotpsecret"></b>: <span class="btn btn-primary btn-sm" data-url="{{.web_base_url}}/client/qr?account=' + row.WebUserName + '&secret=' + row.WebTotpSecret + '" style="cursor: pointer;" onclick="showQr(this)">' + row.WebTotpSecret + '</span>&emsp;'
            }
            var access = accessListDetail(row)
            if (row.Cnf.U || row.Cnf.P) {
                access += '<b langtag="word-basicusername"></b>: ' + row.Cnf.U + '&emsp;'
                + '<b langtag="word-basicpassword"></b>: ' + row.Cnf.P + '&emsp;<br/><br/>'
            }
            var transport = '<b langtag="word-crypt"></b>: <span langtag="word-' + row.Cnf.Crypt + '"></span>&emsp;'
                + '<b langtag="word-compress"></b>: <span langtag="word-' + row.Cnf.Compress + '"></span>&emsp;'
                + '<b langtag="word-connectbyconfig"></b>: <span langtag="word-' + row.ConfigConnAllow + '"></span>&emsp;<br/><br/>'
            var commands = ''
                {{if index . "tcp_p"}}
                + '<b langtag="word-commandclient-tcp"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.tcp_ip}}:{{.tcp_p}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"tcp\"</code>&emsp;<br/><br/>"
                {{end}}
                {{if index . "kcp_p"}}
                + '<b langtag="word-commandclient-kcp"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.kcp_ip}}:{{.kcp_p}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"kcp\"</code>&emsp;<br/><br/>"
                {{end}}
                {{if index . "tls_p"}}
                + '<b langtag="word-commandclient-tls"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.tls_ip}}:{{.tls_p}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"tls\"</code>&emsp;<br/><br/>"
                {{end}}
                {{if index . "quic_p"}}
                + '<b langtag="word-commandclient-quic"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.quic_addr}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"quic\"</code>&emsp;<br/><br/>"
                {{end}}
                {{if index . "ws_p"}}
                + '<b langtag="word-commandclient-ws"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.ws_ip}}:{{.ws_p}}{{.ws_path}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"ws\"</code>&emsp;<br/><br/>"
                {{end}}
                {{if index . "wss_p"}}
                + '<b langtag="word-commandclient-wss"></b>: ' + '<code onclick="oCopy(this)">' + "./npc{{.win}} -server=\"{{.wss_ip}}:{{.wss_p}}{{.ws_path}}\" -vkey=\"" + row.VerifyKey + "\" -type=\"wss\"</code>&emsp;<br/><br/>"
                {{end}}
            return '<div class="resource-details">'
                + resourceDetailSection('section-status', status)
                + resourceDetailSection('section-commands', commands)
                + resourceDetailSection('section-quotas', quotas)
                + resourceDetailSection('section-transport', transport)
                + resourceDetailSection('section-access', access)
                + resourceDetailSection('section-webaccount', account)
                + '</div>'
        },
        //表格的列
        columns: [
            {{if eq true .isAdmin}}
            {field: '_selected', checkbox: true, switchable: false, clickToSelect: false,
                formatter: function (value, row) { return {disabled: row.Id <= 0}; }},
            {{end}}

            {
                field: 'Id',//域值
                title: '<span langtag="word-id"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Remark',//域值
                title: '<span langtag="word-remark"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Version',//域值
                title: '<span langtag="word-version"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + escapeHtml(value) + '</span>'
                }
            },
            {
                field: 'Mode',//域值
                title: '<span langtag="word-scheme"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + getBridgeMode(value) + '</span>'
                }
            },
            {
                field: 'VerifyKey',//域值
                title: '<span langtag="word-verifykey"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (!row.NoStore) {
                        return '<span onclick="oCopy(this)">' + value + '</span>'
                    } else {
                        return '<span langtag="word-publicvkey"></span>'
                    }
                }
            },
            {
                field: 'Addr',//域值
                title: '<span langtag="word-address"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'LocalAddr',//域值
                title: '<span langtag="word-localaddress"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'InletFlow',//域值
                title: '<span langtag="word-inletflow"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.InletFlow) + '</span>'
                    {{else}}
                    return changeunit(row.Flow.InletFlow)
                    {{end}}
                }
            },
            {
                field: 'ExportFlow',//域值
                title: '<span langtag="word-exportflow"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(row.Flow.ExportFlow) + '</span>'
                    {{else}}
                    return changeunit(row.Flow.ExportFlow)
                    {{end}}
                }
            },
            {
                field: 'TotalFlow',//域值
                title: '<span langtag="word-totalflow"></span>',//标题
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + changeunit(typeof value === 'number' ? value : row.Flow.InletFlow + row.Flow.ExportFlow) + '</span>'
                    {{else}}
                    return changeunit(typeof value === 'number' ? value : row.Flow.InletFlow + row.Flow.ExportFlow)
                    {{end}}
                }
            },
            {
                field: 'ActualFlow',//域值
                title: '<span langtag="word-actualflow"></span>',//标题
                align: 'center',
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span title="' + langreply('Total x 2') + '">' + changeunit(typeof value === 'number' ? value : actualFlow(row.Flow)) + '</span>'
                }
            },
            {
                field: 'FlowRemain',//域值
                title: '<span langtag="word-flowremain"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (row.Flow.FlowLimit === 0) {
                        return '∞'
                    }
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(typeof value === 'number' ? value : flowRemain(row.Flow, true)) + '</span>'
                    {{else}}
                    return changeunit(typeof value === 'number' ? value : flowRemain(row.Flow, true))
                    {{end}}
                }
            },
            {
                field: 'TimeRemain',//域值
                title: '<span langtag="word-timeremain"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + getRemainingTime(row.Flow.TimeLimit).formatted + '</span>'
                    {{else}}
                    return getRemainingTime(row.Flow.TimeLimit).formatted
                    {{end}}
                }
            },
            {
                field: 'Flow.FlowLimit',//域值
                title: '<span langtag="word-flowlimit"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (value === 0) {
                        return '<span langtag="word-false"></span>'
                    }
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(value * 1024 * 1024) + '</span>'
                    {{else}}
                    return changeunit(value * 1024 * 1024)
                    {{end}}
                }
            },
            {
                field: 'Flow.TimeLimit',//域值
                title: '<span langtag="word-timelimit"></span>',//标题
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (value === "0001-01-01T00:00:00Z") {
                        return '<span langtag="word-false"></span>'
                    }
                    {{if eq true .isAdmin}}
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/client/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + value + '</span>'
                    {{else}}
                    return value
                    {{end}}
                }
            },
            {
                field: 'NowConn',//域值
                title: '<span langtag="word-nowconn"></span>',//内容
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="oCopy(this)">' + value + '</span>'
                }
            },
            {
                field: 'Speed',
                title: '<span langtag="word-speed"></span>',
                align: 'center',
                halign: 'center',
                visible: true,
                sortable: true,
                sortName: 'speed',
                formatter: function (value, row, index) {
                    return changeunit(typeof value === 'number' ? value : (Number(row.UploadRate) || 0) + (Number(row.DownloadRate) || 0)) + '/s';
                }
            },
            {
                field: 'UploadRate',
                title: '<span langtag="word-uploadspeed"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                sortable: true,
                sortName: 'upload_rate',
                formatter: function (value, row, index) {
                    return changeunit(Number(row.UploadRate) || 0) + '/s';
                }
            },
            {
                field: 'DownloadRate',
                title: '<span langtag="word-downloadspeed"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                sortable: true,
                sortName: 'download_rate',
                formatter: function (value, row, index) {
                    return changeunit(Number(row.DownloadRate) || 0) + '/s';
                }
            },
            {
                field: 'Status',//域值
                title: '<span langtag="word-status"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-open"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-close"></span>'
                    }
                }
            },
            {
                field: 'IsConnect',//域值
                title: '<span langtag="word-connect"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary client-online-ping" langtag="word-online" data-id="' + row.Id + '" style="cursor:pointer;" onclick="pingClient(this,' + row.Id + ')"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option',//域值
                title: '<span langtag="word-option"></span>',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    btn_group = '<div class="btn-group">'

                    {{if eq true .isAdmin}}
                    if (row.Status) {
                        btn_group += '<a onclick="submitform(\'stop\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 0})" class="btn btn-outline btn-warning"><i class="fa fa-pause"></i></a>'
                    } else {
                        btn_group += '<a onclick="submitform(\'start\', \'{{.web_base_url}}/client/changestatus\', {\'id\':' + row.Id
                        btn_group += ', \'status\': 1})" class="btn btn-outline btn-primary"><i class="fa fa-play"></i></a>'
                    }
                    if (row.Id > 0 && row.IsConnect && compareVersion(row.Version, '{{.client_update_min}}') >= 0 && compareVersion(row.Version, '{{.version}}') < 0) {
                        btn_group += '<a onclick="submitform(\'update\', \'{{.web_base_url}}/client/update\', {\'id\':' + row.Id
                        btn_group += '})" class="btn btn-outline btn-info"><i class="fa fa-arrow-circle-up"></i></a>'
                    }
                    if (row.Id > 0) {
                        btn_group += '<a onclick="submitform(\'delete\', \'{{.web_base_url}}/client/del\', {\'id\':' + row.Id
                        btn_group += '})" class="btn btn-outline btn-danger"><i class="fa fa-trash"></i></a>'
                    }
                    {{end}}

                    btn_group += '<a href="{{.web_base_url}}/client/edit?id=' + row.Id
                    btn_group += '" class="btn btn-outline btn-success"><i class="fa fa-edit"></i></a></div>'
                    return btn_group
                }
            },
            {
                field: 'show',//域值
                title: '<span langtag="word-show">',//内容
                align: 'center',
                halign: 'center',
                visible: true,//false表示不显示
                formatter: function (value, row, index) {
                    return '<div class="btn-group"><a href="{{.web_base_url}}/index/all?client_id=' + row.Id
                        + '" class="btn btn-outline btn-primary" langtag="word-tunnel"></a>'
                        + '<a href="{{.web_base_url}}/index/hostlist?client_id=' + row.Id
                        + '" class="btn btn-outline btn-success" langtag="word-host"></a></div>'
                }
            }
        ]
    });
    initListLive('client', '{{.web_base_url}}');
    {{if eq true .isAdmin}}
    initListBatch('client', '{{.web_base_url}}');
    {{end}}

    function pingClient(el, id) {
        var $el = $(el);
        if ($el.data('pinging')) return;
        var oldText = $el.text();
        $el.data('pinging', true)
            .attr('title', 'Pinging...')
            .text('...')
            .addClass('disabled');
        $.ajax({
            url: '{{.web_base_url}}/client/pingclient',
            type: 'POST',
            dataType: 'json',
            data: { id: id }
        }).done(function (res) {
            if (res && res.code === 1) {
                var ms = parseInt(res.rtt, 10);
                if (isNaN(ms)) ms = res.rtt;
                $el.text(ms + ' ms');
            } else {
                $el.text('ERR');
            }
        }).fail(function () {
            $el.text('ERR');
        }).always(function () {
            $el.data('pinging', false)
                .removeClass('disabled')
                .removeAttr('title');
        });
    }

    function triggerVisibleClientPing(btn) {
        var $btn = $(btn);
        if ($btn.data('pinging')) return;
        $btn.data('pinging', true).addClass('disabled');
        $('#table').find('span.client-online-ping[data-id]').each(function () {
            var id = parseInt($(this).attr('data-id'), 10);
            if (!isNaN(id) && id > 0) {
                pingClient(this, id);
            }
        });
        setTimeout(function () {
            $btn.data('pinging', false).removeClass('disabled');
        }, 600);
    }

    function showQr(el) {
        var url = el.getAttribute('data-url');
        document.getElementById('qrImg').src = url;
        $('#qrModal').modal('show');
    }

    // showGlobalTraffic shows the traffic forwarded by the whole server,
    // which the client list returns to administrators.
    function showGlobalTraffic(t) {
        if (t) $('#global_traffic').data('limit', t.limit);
        if (!t) return;
        $('#global_traffic_in').text(changeunit(t.in));
        $('#global_traffic_out').text(changeunit(t.out));
        $('#global_traffic_total').text(changeunit(t.in + t.out));
        $('#global_traffic_actual').text(changeunit((t.in + t.out) * 2));
        $('#global_traffic_rate_in').text(changeunit(t.inBps) + '/s');
        $('#global_traffic_rate_out').text(changeunit(t.outBps) + '/s');
        $('#global_traffic_limit').text(t.limit > 0 ? changeunit(t.limit) + '/s' : '');
        $('#global_traffic_limit_box').toggle(t.limit > 0);
        $('#global_traffic').show();
    }
</script>
