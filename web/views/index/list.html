<div class="wrapper wrapper-content animated fadeInRight">
    <div class="row">
        <div class="col-lg-12">
            <div class="ibox float-e-margins">
                <div class="ibox-title">
                    <h5><span id="langtag"></span><span></span></h5>
                    <div class="ibox-tools">
                        <a class="collapse-link">
                            <i class="fa fa-chevron-up"></i>
                        </a>
                        <a class="close-link">
                            <i class="fa fa-times"></i>
                        </a>
                    </div>
                </div>
                <div class="content">
                    <div class="table-responsive">
                        <div id="toolbar">
                            {{ if or (not .type) (ne .type "service") }}
                            <a class="btn btn-primary dim" href="{{.web_base_url}}/index/add?type={{.type}}&client_id={{.client_id}}">
                                <i class="fa fa-fw fa-lg fa-plus"></i>
                                <span langtag="word-add"></span>
                            </a>
                            {{ end }}
                        </div>
                        <table class="table-striped table-hover" data-mobile-responsive="true" id="taskList_table"></table>
                    </div>
                </div>
                <div class="ibox-content">
                    <table id="table"></table>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="{{.web_base_url}}/static/js/launch-generator.js?v={{.version}}"></script>
<script>
    {{ $p2p := and .type (eq .type "secret") }}
    var launchBase = {carriers: {{.link_urls}}, primary: {{.bridge_url}}, bin: {{.npc_bin}}, base: {{.web_base_url}}, visitor: {{.visitor_vkey}}};
    name = '{{.name}}:'.replace(/\s*/g, "")
    $('#langtag').attr('langtag', 'page-list' + name.replace(/:.*/, "")).next().text(name.split(":")[1])

    /*bootstrap table*/
    function uploadLimitValue(row) {
        var limit = Number(row.UploadLimit) || 0;
        var value = limit === 0 ? '<span langtag="word-unlimitedrate"></span>' : limit + ' KB/s';
        return '<span role="button" tabindex="0" style="cursor:pointer" onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'upload_limit\'})" onkeydown="if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); this.click(); }">' + value + '</span>';
    }

    function downloadLimitValue(row) {
        var limit = Number(row.DownloadLimit) || 0;
        var value = limit === 0 ? '<span langtag="word-unlimitedrate"></span>' : limit + ' KB/s';
        return '<span role="button" tabindex="0" style="cursor:pointer" onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'download_limit\'})" onkeydown="if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); this.click(); }">' + value + '</span>';
    }

    // Everything a client reports (kind, name, target) is shown escaped.
    function copyKeys() {
        return 'onkeydown="if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); this.click(); }"';
    }

    function copyable(v) {
        return '<span role="button" tabindex="0" style="cursor:pointer" onclick="oCopy(this)" ' + copyKeys() + '>' + escapeHtml(v == null ? '' : v) + '</span>';
    }

    // clearFlow wraps a traffic value that clears the traffic counters of the
    // tunnel (the direct traffic of a point-to-point tunnel included) when
    // clicked, touched or activated from the keyboard.
    function clearFlow(row, html) {
        return '<span role="button" tabindex="0" style="cursor:pointer;white-space:nowrap" onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})" ' + copyKeys() + '>' + html + '</span>'
    }

    // actionBtn is a button of the option column that mouse, touch and keyboard can use.
    function actionBtn(cls, icon, onclick, href) {
        return '<a role="button" tabindex="0" ' + (href ? 'href="' + href + '" ' : '') + (onclick ? 'onclick="' + onclick + '" ' : '')
            + 'onkeydown="if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); this.click(); }" class="btn btn-outline ' + cls + '"><i class="fa ' + icon + '"></i></a>';
    }

    var clientScoped = new URLSearchParams(location.search).has('client_id')
    // A list opened for one client shows that client in its title.
    function scopedColumn(c) {
        return !clientScoped || (c.field !== 'Client.Id' && c.field !== 'Client.VerifyKey')
    }

    // A virtual backend is reported by a client and listens nowhere: the
    // client, what it calls the service, its kind and network, and the target
    // to copy into the target of a tunnel.
    var serviceColumns = [
        {
            field: 'Client.Id',
            title: '<span langtag="word-clientid"></span>',
            halign: 'center',
            formatter: function (value, row) {
                var text = row.Client.Remark ? (row.Client.Id + ' · ' + row.Client.Remark) : row.Client.Id
                return '<span role="button" tabindex="0" style="cursor:pointer" data-copy="' + escapeHtml(row.Client.VerifyKey) + '" onclick="copyText(this.dataset.copy)" ' + copyKeys() + '>' + escapeHtml(text) + '</span>'
            }
        },
        {field: 'Remark', title: '<span langtag="word-remark"></span>', halign: 'center', formatter: function (value) { return copyable(value) }},
        {field: 'ServiceKind', title: '<span langtag="word-servicekind"></span>', halign: 'center',
            formatter: function (value) { return escapeHtml(String(value == null ? '' : value).toUpperCase()) }},
        {field: 'TargetType', title: '<span langtag="word-network"></span>', halign: 'center',
            formatter: function (value) { return escapeHtml(String(value == null ? '' : value).toUpperCase()) }},
        {field: 'Target.TargetStr', title: '<span langtag="word-target"></span>', halign: 'center', formatter: function (value) { return copyable(value) }},
        {
            field: 'option',
            title: '<span langtag="word-option"></span>',
            align: 'center',
            halign: 'center',
            formatter: function (value, row) {
                // a backend a client reports has nothing to stop, delete or edit
                return '<div class="btn-group">' + actionBtn('btn-secondary', 'fa-copy', "copyText('" + escapeHtml(row.Target.TargetStr) + "')") + '</div>'
            }
        }
    ].filter(scopedColumn)

    npsList.init('#table', {
        toolbar: "#toolbar",
        idField: "Id",
        uniqueId: "Id",
        clickToSelect: false,
        method: 'post', // 服务器数据的请求方式 get or post
        url: "{{.web_base_url}}/index/gettunnel", // 服务器数据的加载地址
        queryParams: function (params) {
            return {
                "offset": params.offset,
                "limit": params.limit,
                "type": {{.type}},
                "client_id": {{.client_id}},
                "search": params.search,
                "sort": params.sort,
                "order": params.order
            }
        },
        search: true,
        contentType: "application/x-www-form-urlencoded",
        striped: true, // 设置为true会有隔行变色效果
        showHeader: true,
        showColumns: true,
        showRefresh: true,
        pagination: true, //分页
        sidePagination: 'server', //服务器端分页
        pageNumber: 1,
        pageList: [5, 10, 20, 50, 100, 'all'],
        cookie: true,
        cookieIdTable: '{{if .type}}{{.type}}{{else}}tunnel{{end}}',
        cookieStorage: 'localStorage',
        // Only the layout is kept across visits; a search or page left over
        // from another list or client would hide rows without notice.
        cookiesEnabled: ['bs.table.sortOrder', 'bs.table.sortName', 'bs.table.sortPriority', 'bs.table.pageList'],
        detailView: {{ if and .type (eq .type "service") }}false{{ else }}true{{ end }},
        smartDisplay: true, // 智能显示 pagination 和 cardview 等
        onExpandRow: function (index, row, $el) { $('body').setLang('.detail-view'); if (row.Mode == 'secret') LaunchGen.fill(launchBase, 'tunnel', row, $el); },
        onLoadSuccess:function (data) { $('body').setLang('.detail-view'); },
        onPostBody: function (data) { if ($(this)[0].locale != undefined ) $('body').setLang('#table'); },
        detailFormatter: function (index, row, element) {
            var proxyprotocol = ''
            if (row.Mode == "tcp" || row.Mode == "udp") {
                proxyprotocol = '<b langtag="word-proxyprotocoltitle"></b>: <span langtag="word-proxyprotocolv' + row.Target.ProxyProtocol + '"></span>&emsp;'
            }
            var usage = '<b langtag="word-exportflow"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + npsLiveValue('Flow.ExportFlow', changeunit(row.Flow.ExportFlow)) + '</span>&emsp;'
                + '<b langtag="word-inletflow"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow\'})">' + npsLiveValue('Flow.InletFlow', changeunit(row.Flow.InletFlow)) + '</span>&emsp;'
                + '<b langtag="word-flowlimit"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + row.Flow.FlowLimit + 'MB</span>&emsp;'
                + '<b langtag="word-timelimit"></b>: <span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + timeLimitText(row.Flow.TimeLimit) + '</span>&emsp;'
            usage += '<b langtag="word-maxconnections"></b>: <span role="button" tabindex="0" style="cursor:pointer" onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'max_conn\'})" onkeydown="if (event.key === \'Enter\' || event.key === \' \') { event.preventDefault(); this.click(); }">' + (Number(row.MaxConn) || 0) + '</span>&emsp;'
            usage += '<b langtag="word-uploadlimit"></b>: ' + uploadLimitValue(row) + '&emsp;'
                + '<b langtag="word-downloadlimit"></b>: ' + downloadLimitValue(row) + '&emsp;'
            var transport = '<b langtag="word-crypt"></b>: <span langtag="word-' + row.Client.Cnf.Crypt + '"></span>&emsp;'
                + '<b langtag="word-compress"></b>: <span langtag="word-' + row.Client.Cnf.Compress + '"></span>&emsp;'
                + proxyprotocol
                + (row.Mode == "secret" ? '<br/><br>' : '<b langtag="word-ishttp"></b>: <span langtag="word-' + row.IsHttp + '"></span>&emsp;<br/><br>')
            // Speed and traffic belong to the limits, the proxy switches to the
            // forwarding settings; the overview keeps what has no other place.
            usage += '<br/><br>' + npsList.detailColumns('#table', row, index, ['Speed', 'UploadRate', 'DownloadRate', 'DirectFlow', 'TotalFlow', 'ActualFlow', 'FlowRemain', 'TimeRemain', 'NowConn'])
            usage += npsList.detailColumns('#table', row, index, ['Target.LocalProxy'])
            transport += npsList.detailColumns('#table', row, index, ['HttpProxy', 'Socks5Proxy'])
            var tmp = resourceDetailSection('section-overview', npsList.detailColumns('#table', row, index, ['TargetType', 'Password']))
                + resourceDetailSection('section-limits', usage)
                + resourceDetailSection('section-transport', transport)
            var access = row.Mode != "secret" ? accessListDetail(row) : ''
            if (row.Mode != "mixProxy") {
                tmp += resourceDetailSection('section-access', access)
            }
            if (row.Mode == "mixProxy") {
                // 0=off, 1=whitelist, 2=blacklist
                var destMode = Number(row.DestAclMode || 0)
                var modeSpan = ''
                if (destMode === 1) {
                    modeSpan = '<span langtag="word-whitelist"></span>'
                } else if (destMode === 2) {
                    modeSpan = '<span langtag="word-blacklist"></span>'
                } else {
                    modeSpan = '<span langtag="word-disable"></span>'
                }
                var destAclInfo = '<b langtag="word-destacl"></b>: ' + modeSpan + '&emsp;'
                return tmp + resourceDetailSection('section-access', access
                    + '<b langtag="word-basicusername"></b>: ' + escapeHtml(row.Client.Cnf.U) + '&emsp;'
                    + '<b langtag="word-basicpassword"></b>: ' + escapeHtml(row.Client.Cnf.P) + '&emsp;<br/><br>'
                    + '<b langtag="word-auth"></b>: ' + escapeHtml(row.UserAuth && row.UserAuth.Content ? row.UserAuth.Content : '') + '&emsp;<br/><br>'
                    ) + resourceDetailSection('section-destination', destAclInfo)
            }
            if (row.Mode == "secret") {
                var scope = {1: 'word-whitelist', 2: 'word-blacklist'}[Number(row.DestAclMode || 0)] || 'word-disable'
                return tmp + resourceDetailSection('section-destination', '<b langtag="word-destacl"></b>: <span langtag="' + scope + '"></span>')
                    + resourceDetailSection('section-commands', LaunchGen.detail(launchBase, 'tunnel', row))
            }
            return '<div class="resource-details">' + tmp + '</div>'
        },
        // 表格的列
        columns: {{ if and .type (eq .type "service") }}serviceColumns{{ else }}[
            {field: '_selected', checkbox: true, switchable: false, clickToSelect: false},

            {
                field: 'Id', //域值
                title: '<span langtag="word-id"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {
                field: 'Client.Id', //域值
                title: '<span langtag="word-clientid"></span>', //标题
                halign: 'center',
                detail: false, // a column of the table
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var text = row.Client.Remark ? (row.Client.Id + ' · ' + row.Client.Remark) : row.Client.Id
                    return '<span role="button" tabindex="0" style="cursor:pointer" data-copy="' + escapeHtml(row.Client.VerifyKey) + '" onclick="copyText(this.dataset.copy)" ' + copyKeys() + '>' + escapeHtml(text) + '</span>'
                }
            },
            {
                field: 'Remark', //域值
                title: '<span langtag="word-remark"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {
                field: 'Client.VerifyKey', //域值
                title: '<span langtag="word-verifykey"></span>', //标题
                halign: 'center',
                detail: false, // the key of the client is not part of a tunnel's details
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {{ if not .type }}
            {
                field: 'Mode', //域值
                title: '<span langtag="word-scheme"></span>', //标题
                halign: 'center',
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span langtag="scheme-' + value + '"></span>'
                }
            },
            {{ end }}
            {
                field: 'Port', //域值
                title: '<span langtag="word-port"></span>', //标题
                halign: 'center',
                visible: {{ if and .type (eq .type "secret") }}false{{ else }}true{{ end }}, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var generated = row.Generated || (row.NoStore && row.Target && String(row.Target.TargetStr).indexOf('service://') === 0)
                    return copyable(value)
                        + (row.ServiceDown ? ' <span class="badge badge-danger" langtag="word-servicedown"></span>' : '')
                        + (generated ? ' <span class="badge badge-secondary" langtag="word-generatedtunnel"></span>' : '')
                }
            },
            {{ if or (not .type) (eq .type "tcp") (eq .type "udp") (eq .type "secret") }}
            {
                field: 'Target.TargetStr', //域值
                title: '<span langtag="word-target"></span>', //标题
                halign: 'center',
                visible: {{ if and .type (eq .type "secret") }}false{{ else }}true{{ end }}, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {{ end }}
            {{ if or (not .type) (eq .type "secret") }}
            {
                field: 'TargetType', //域值
                title: '<span langtag="word-targettype"></span>', //标题
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(String(value).toUpperCase())
                }
            },
            {
                field: 'Password', //域值
                title: '<span langtag="{{ if $p2p }}word-accesskey{{ else }}word-identificationkey{{ end }}"></span>', //标题
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {{ end }}
            {{ if and .type (eq .type "mixProxy") }}
            {
                field: 'HttpProxy', //域值
                title: '<span langtag="word-httpproxy"></span>', //内容
                align: 'center',
                halign: 'center',
                detail: false, // a column of the table
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var btn_group = '<div class="btn-group">'
                    if (value) {
                        btn_group += actionBtn('btn-warning', 'fa-pause', 'submitform(\'stop\', \'{{.web_base_url}}/index/stop\', {\'id\':' + row.Id + ', \'mode\': \'http\'})')
                    } else {
                        btn_group += actionBtn('btn-primary', 'fa-play', 'submitform(\'start\', \'{{.web_base_url}}/index/start\', {\'id\':' + row.Id + ', \'mode\': \'http\'})')
                    }
                    btn_group += '</div>'
                    return btn_group

                }
            },
            {
                field: 'Socks5Proxy', //域值
                title: '<span langtag="word-socks5proxy"></span>', //内容
                align: 'center',
                halign: 'center',
                detail: false, // a column of the table
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    var btn_group = '<div class="btn-group">'
                    if (value) {
                        btn_group += actionBtn('btn-warning', 'fa-pause', 'submitform(\'stop\', \'{{.web_base_url}}/index/stop\', {\'id\':' + row.Id + ', \'mode\': \'socks5\'})')
                    } else {
                        btn_group += actionBtn('btn-primary', 'fa-play', 'submitform(\'start\', \'{{.web_base_url}}/index/start\', {\'id\':' + row.Id + ', \'mode\': \'socks5\'})')
                    }
                    btn_group += '</div>'
                    return btn_group
                }
            },
            {{ end }}
            {
                field: 'Speed',
                title: '<span langtag="word-speed"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                sortable: true,
                sortName: 'speed',
                formatter: function (value, row, index) {
                    return changeunit(typeof value === 'number' ? value : (Number(row.UploadRate) || 0) + (Number(row.DownloadRate) || 0)) + '/s';
                }
            },
            {
                field: 'UploadRate',
                title: '<span langtag="word-uploadspeed"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                sortable: true,
                sortName: 'upload_rate',
                formatter: function (value, row, index) {
                    return changeunit(Number(row.UploadRate) || 0) + '/s';
                }
            },
            {
                field: 'DownloadRate',
                title: '<span langtag="word-downloadspeed"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                sortable: true,
                sortName: 'download_rate',
                formatter: function (value, row, index) {
                    return changeunit(Number(row.DownloadRate) || 0) + '/s';
                }
            },
            {
                field: 'InletFlow', //域值
                title: '<span langtag="word-inletflow"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return clearFlow(row, changeunit(row.Flow.InletFlow))
                }
            },
            {
                field: 'ExportFlow', //域值
                title: '<span langtag="word-exportflow"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return clearFlow(row, changeunit(row.Flow.ExportFlow))
                }
            },
            {
                field: 'DirectFlow',
                title: '<span langtag="word-directflow"></span>',
                align: 'center',
                halign: 'center',
                visible: {{ if $p2p }}true{{ else }}false{{ end }},
                sortable: false,
                // Only a point-to-point tunnel has direct paths.
                detail: {{ if $p2p }}false{{ else }}function (row) { return row.Mode == 'secret'; }{{ end }},
                formatter: function (value, row, index) {
                    if (row.Mode != 'secret') return '-'
                    var flow = row.Flow || {}
                    return clearFlow(row, changeunit(flow.DirectIn || 0) + ' / ' + changeunit(flow.DirectOut || 0))
                }
            },
            {
                field: 'TotalFlow', //域值
                title: '<span langtag="{{ if $p2p }}word-relayflow{{ else }}word-totalflow{{ end }}"></span>', //内容
                align: 'center',
                halign: 'center',
                detail: {{ if $p2p }}false{{ else }}true{{ end }}, // a column of the table on the point-to-point list
                visible: {{ if $p2p }}true{{ else }}false{{ end }}, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return clearFlow(row, changeunit(typeof value === 'number' ? value : row.Flow.InletFlow + row.Flow.ExportFlow))
                }
            },
            {
                field: 'ActualFlow',//域值
                title: '<span langtag="word-actualflow"></span>',//标题
                align: 'center',
                halign: 'center',
                visible: false,//false表示不显示
                sortable: true,//启用排序
                formatter: function (value, row, index) {
                    return '<span title="' + langreply('Total x 2') + '">' + changeunit(typeof value === 'number' ? value : actualFlow(row.Flow)) + '</span>'
                }
            },
            {
                field: 'FlowRemain', //域值
                title: '<span langtag="word-flowremain"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (row.Flow.FlowLimit === 0) {
                        return '∞'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(typeof value === 'number' ? value : flowRemain(row.Flow)) + '</span>'
                }
            },
            {
                field: 'TimeRemain', //域值
                title: '<span langtag="word-timeremain"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + getRemainingTime(row.Flow.TimeLimit).formatted + '</span>'
                }
            },
            {
                field: 'UploadLimit',
                title: '<span langtag="word-uploadlimit"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                formatter: function (value, row, index) {
                    return uploadLimitValue(row);
                }
            },
            {
                field: 'DownloadLimit',
                title: '<span langtag="word-downloadlimit"></span>',
                align: 'center',
                halign: 'center',
                visible: false,
                formatter: function (value, row, index) {
                    return downloadLimitValue(row);
                }
            },
            {
                field: 'Flow.FlowLimit', //域值
                title: '<span langtag="word-flowlimit"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value === 0) {
                        return '<span langtag="word-false"></span>'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'flow_limit\'})">' + changeunit(value * 1024 * 1024) + '</span>'
                }
            },
            {
                field: 'Flow.TimeLimit', //域值
                title: '<span langtag="word-timelimit"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value === "0001-01-01T00:00:00Z") {
                        return '<span langtag="word-false"></span>'
                    }
                    return '<span onclick="submitform(\'clear\', \'{{.web_base_url}}/index/clear\', {\'id\':' + row.Id + ', \'mode\': \'time_limit\'})">' + value + '</span>'
                }
            },
            {
                field: 'NowConn', //域值
                title: '<span langtag="word-nowconn"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: false, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    return copyable(value)
                }
            },
            {{ if or (not .type) (eq .type "tcp") (eq .type "udp") (eq .type "secret") }}
            {
                field: 'Target.LocalProxy',
                title: '<span langtag="word-localproxycol"></span>',
                align: 'center',
                halign: 'center',
                detail: {{ if $p2p }}true{{ else }}false{{ end }}, // shown in the details of the point-to-point list only
                visible: false,
                formatter: function (value, row, index) {
                    return value ? '<span class="badge badge-primary" langtag="word-yes"></span>' : '<span class="badge badge-badge" langtag="word-no"></span>'
                }
            },
            {{ end }}
            {
                field: 'Status', //域值
                title: '<span langtag="word-enabledstatus"></span>', //内容
                align: 'center',
                halign: 'center',
                detail: false, // a column of the table
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        return '<span class="badge badge-primary" langtag="word-enabled"></span>'
                    } else {
                        return '<span class="badge badge-badge" langtag="word-paused"></span>'
                    }
                }
            },
            {
                field: 'RunStatus', //域值
                title: '<span langtag="word-listenstatus"></span>', //内容
                align: 'center',
                halign: 'center',
                detail: false, // the pause/start button shows it
                visible: false, // the switch of the option column shows it; the column is there to be chosen
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        if (row.Mode && row.Mode == "tcp") {
                            return '<a href="' + 'http://{{.ip}}:' + row.Port + '" target="_blank"><span class="badge badge-primary" langtag="word-listening"></span></a>'
                        } else {
                            return '<span class="badge badge-primary" langtag="word-listening"></span>'
                        }
                    } else {
                        return '<span class="badge badge-badge" langtag="word-notlistening"></span>'
                    }
                }
            },
            {
                field: 'Client.IsConnect', //域值
                title: '<span langtag="word-clientstatus"></span>', //内容
                align: 'left',
                halign: 'left',
                detail: false, // a column of the table
                visible: true, //false表示不显示
                sortable: true, //启用排序
                formatter: function (value, row, index) {
                    if (value) {
                        if (row.Mode && row.Mode == "tcp") {
                            return '<a href="' + (row.IsHttp ? 'http://' : 'https://') + '{{.ip}}:' + row.Port + '" target="_blank"><span class="badge badge-primary" langtag="word-online"></span></a>'
                        } else {
                            return '<span class="badge badge-primary" langtag="word-online"></span>'
                        }
                    } else {
                        return '<span class="badge badge-badge" langtag="word-offline"></span>'
                    }
                }
            },
            {
                field: 'option', //域值
                title: '<span langtag="word-option"></span>', //内容
                align: 'center',
                halign: 'center',
                visible: true, //false表示不显示
                formatter: function (value, row, index) {
                    var btn_group = '<div class="btn-group">'
                    var idArg = "{'id':" + row.Id + "})"
                    if (row.Status) {
                        btn_group += actionBtn('btn-warning', 'fa-pause', "submitform('stop', '{{.web_base_url}}/index/stop', " + idArg)
                    } else {
                        btn_group += actionBtn('btn-primary', 'fa-play', "submitform('start', '{{.web_base_url}}/index/start', " + idArg)
                    }
                    btn_group += actionBtn('btn-danger', 'fa-trash', "submitform('delete', '{{.web_base_url}}/index/del', " + idArg)
                    if (row.Mode == 'secret') {
                        btn_group += actionBtn('btn-secondary', 'fa-terminal', '', '{{.web_base_url}}/index/launch?id=' + row.Id)
                    }
                    if (row.Mode) {
                        btn_group += actionBtn('btn-success', 'fa-edit', '', '{{.web_base_url}}/index/edit?id=' + row.Id)
                    }
                    btn_group += '</div>'
                    return btn_group
                }
            }
        ].filter(scopedColumn){{ end }}
    }, {key: 'tunnel-{{if .type}}{{.type}}{{else}}all{{end}}'});
    initListLive('tunnel', '{{.web_base_url}}');
    {{ if or (not .type) (ne .type "service") }}
    initListBatch('tunnel', '{{.web_base_url}}');
    {{ end }}
</script>
